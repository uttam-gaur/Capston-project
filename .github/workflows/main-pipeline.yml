name: Main CI/CD Pipeline

on:
  push:
    branches:
      - main


jobs:
  build-test:
    uses: ./.github/workflows/reusable-build-test.yml

    with:
      python_version: "3.12"
      run_tests: true


  docker-build:
    needs: build-test

    uses: ./.github/workflows/reusable-docker.yml

    with:
      image_name: github-actions-capstone
      tag: sha-${{ github.sha }}

    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}


  deploy:
  needs: docker-build
  runs-on: ubuntu-latest

  environment:
    name: production

  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Pull production image
      run: |
        docker pull ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest

    - name: Deploy container
      run: |
        docker run -d \
          --name capstone-app \
          -p 5001:5001 \
          ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest

    - name: Verify deployment
      run: |
        sleep 5
        curl --fail http://localhost:5000/health

    - name: Deployment summary
      run: |
        echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
        echo "- Image: ${{ needs.docker-build.outputs.image_url }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Status: PASSED" >> "$GITHUB_STEP_SUMMARY"