name: Scheduled Health Check

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull latest image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest

      - name: Run container
        run: |
          docker run -d \
            --name capstone-app \
            -p 5001:5001 \
            ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest

      - name: Wait for application
        run: sleep 5

      - name: Check health endpoint
        id: health
        run: |
          if curl --fail http://localhost:5000/health
          then
            echo "Health Check PASSED"
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "Health Check FAILED"
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Health Check Summary
        if: always()
        run: |
          echo "## Health Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: github-actions-capstone:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.health.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker stop capstone-app || true
          docker rm capstone-app || true